<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartão de Viagem</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <main class="container">

        <div class="card">

            <div class="badge">DESTINO DOS SONHOS</div>

            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800"
                 alt="Praia paradisíaca">

            <div class="conteudo">

                <h1>Fernando de Noronha</h1>

                <p class="local">📍 Pernambuco, Brasil</p>

                <p class="descricao">
                    Descubra praias paradisíacas, águas cristalinas
                    e paisagens incríveis. Uma viagem inesquecível
                    espera por você!
                </p>

                <div class="informacoes">
                    <span>☀️ 7 dias</span>
                    <span>🏨 Hotel incluso</span>
                    <span>✈️ Passagem</span>
                </div>

                <div class="rodape">
                    <div class="preco">
                        <small>A partir de</small>
                        <h2>R$ 2.499</h2>
                    </div>

                    <a href="#" class="botao">Viajar agora</a>
                </div>

            </div>
        </div>

    </main>

</body>
</html>
